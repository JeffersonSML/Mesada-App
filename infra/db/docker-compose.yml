services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PGDATABASE:-mesada}
      POSTGRES_USER: ${PGSUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PGSUPERUSER_PASSWORD:-postgres}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - mesada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGSUPERUSER:-postgres} -d ${PGDATABASE:-mesada}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mesada_pgdata:
